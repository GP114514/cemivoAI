<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>cemivoAI</title><link rel="stylesheet" href="/screen.css"><script src="/screen.js" defer></script></head>
<body>
  <main id="screen" aria-label="模型生成画面"><img id="image" alt="当前模型生成画面，可左键点击，右键输入" draggable="false" tabindex="0" hidden><p id="empty">正在连接你的画面…</p></main>
  <div id="progress" aria-hidden="true" hidden><i></i></div><span id="pulse" aria-hidden="true" hidden></span>
  <div id="activity" role="status" aria-live="polite" hidden><span id="stage"></span><span id="elapsed" aria-hidden="true"></span></div>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <p id="help" hidden><span id="helpText"></span><a id="helpLink" href="/live#plannerKey" target="_blank" rel="noopener">连接 DeepSeek ↗</a></p>
  <form id="input" hidden aria-label="输入文字"><textarea id="text" rows="2" maxlength="500" aria-label="输入文字" placeholder="想做什么？" spellcheck="false"></textarea><button id="send" type="submit">发送</button></form>
</body>
</html>
